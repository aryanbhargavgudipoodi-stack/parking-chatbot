name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Download spaCy model (for PII guardrail)
        run: python -m spacy download en_core_web_sm

      - name: Lint
        run: flake8 src data evaluation tests --max-line-length=120 --extend-ignore=E203,W503 --exit-zero

      - name: Run tests with coverage
        env:
          OPENAI_API_KEY: "sk-test-placeholder"
        run: pytest -v --cov=src --cov=data --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build chatbot image
        run: docker build -t parking-chatbot:ci .